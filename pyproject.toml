[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strict-topk-overlap"
version = "0.1.0"
description = "Speculative sparse attention with guarded repair and controlled extra mass"
requires-python = ">=3.10"
dependencies = ["torch>=2.8", "triton>=3.4"]

[tool.setuptools.packages.find]
include = ["strict_topk*"]
